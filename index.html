<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News Digest</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    background: #f8fafc;
    color: #0f172a;
    line-height: 1.45;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0b1220; color: #e2e8f0; }
    .card { background: #131c2e !important; }
    .summary { color: #94a3b8 !important; }
    header { background: #0f172a !important; border-color: #1e293b !important; }
    .meta { color: #94a3b8 !important; }
    .pill { background: #1e293b !important; color: #94a3b8 !important; }
    .refresh-btn { background: #2563eb !important; }
  }
  header {
    background: #ffffff;
    border-bottom: 1px solid #e2e8f0;
    padding: 20px 24px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { margin: 0 0 8px 0; font-size: 1.4rem; }
  .meta { color: #64748b; font-size: 0.85rem; margin-bottom: 12px; }
  .refresh-btn {
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    max-width: 720px;
    display: block;
  }
  .refresh-btn:disabled { opacity: 0.6; cursor: default; }
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
  .category { margin-bottom: 32px; }
  .category h2 {
    font-size: 1.05rem;
    margin: 0 0 12px 0;
    padding-bottom: 6px;
    border-bottom: 2px solid;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .item-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .card { background: #ffffff; border-radius: 10px; padding: 12px 14px; box-shadow: 0 1px 2px rgba(15,23,42,0.06); }
  .card-header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .item-title { font-weight: 600; font-size: 0.98rem; color: #0f172a; text-decoration: none; }
  @media (prefers-color-scheme: dark) { .item-title { color: #e2e8f0 !important; } }
  .item-title:hover { text-decoration: underline; }
  .pill {
    flex-shrink: 0; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.03em;
    color: #64748b; background: #f1f5f9; border-radius: 6px; padding: 2px 6px; white-space: nowrap;
  }
  .summary { margin: 4px 0 0 0; font-size: 0.86rem; color: #64748b; }
  .status { text-align: center; font-size: 0.85rem; color: #64748b; padding: 24px 0; }
  footer { text-align: center; font-size: 0.78rem; color: #94a3b8; padding: 16px; }
</style>
</head>
<body>
<header>
  <h1>📰 Your News Digest</h1>
  <div class="meta" id="meta">Tap the button to fetch the latest headlines.</div>
  <button class="refresh-btn" id="refreshBtn" onclick="refreshDigest()">🔄 Fetch latest news</button>
</header>
<main id="main">
  <div class="status" id="status"></div>
</main>
<footer>Sources: BBC News (World, Business, Technology, Sport), Spiegel (World), Golem (Technology)</footer>

<script>
const CATEGORY_META = {
  World:      { emoji: "🌍", color: "#2563eb" },
  Business:   { emoji: "💰", color: "#16a34a" },
  Technology: { emoji: "💻", color: "#7c3aed" },
  Sport:      { emoji: "⚽", color: "#ea580c" },
};

const FEEDS = [
  { url: "https://feeds.bbci.co.uk/news/world/rss.xml", category: "World", source: "BBC" },
  { url: "https://www.spiegel.de/schlagzeilen/index.rss", category: "World", source: "Spiegel" },
  { url: "https://feeds.bbci.co.uk/news/business/rss.xml", category: "Business", source: "BBC" },
  { url: "https://feeds.bbci.co.uk/news/technology/rss.xml", category: "Technology", source: "BBC" },
  { url: "https://rss.golem.de/rss.php?feed=RSS2.0", category: "Technology", source: "Golem" },
  { url: "https://feeds.bbci.co.uk/sport/rss.xml", category: "Sport", source: "BBC" },
];

const CORS_PROXIES = [
  (u) => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  (u) => "https://corsproxy.io/?url=" + encodeURIComponent(u),
  (u) => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u),
];

const ITEMS_PER_FEED = 5;
const FETCH_TIMEOUT_MS = 6000;

function stripHtml(str) {
  if (!str) return "";
  const doc = new DOMParser().parseFromString(str, "text/html");
  return (doc.body.textContent || "").trim();
}

function truncate(str, max) {
  if (!str) return "";
  return str.length > max ? str.slice(0, max - 1).trim() + "…" : str;
}

async function fetchWithTimeout(url, ms) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  try {
    return await fetch(url, { cache: "no-store", signal: controller.signal });
  } finally {
    clearTimeout(timer);
  }
}

async function fetchFeed(feed) {
  let lastErr;
  for (const proxy of CORS_PROXIES) {
    try {
      const res = await fetchWithTimeout(proxy(feed.url), FETCH_TIMEOUT_MS);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const text = await res.text();
      const xml = new DOMParser().parseFromString(text, "text/xml");
      if (xml.querySelector("parsererror")) throw new Error("bad XML");
      const nodes = Array.from(xml.querySelectorAll("item")).slice(0, ITEMS_PER_FEED);
      return nodes.map((node) => {
        const title = node.querySelector("title")?.textContent?.trim() || "(untitled)";
        const link = node.querySelector("link")?.textContent?.trim() || feed.url;
        const rawDesc = node.querySelector("description")?.textContent || "";
        const summary = truncate(stripHtml(rawDesc), 140);
        return { title, link, summary, source: feed.source, category: feed.category };
      });
    } catch (err) {
      lastErr = err;
    }
  }
  console.warn("Feed failed:", feed.url, lastErr);
  return [];
}

async function refreshDigest() {
  const btn = document.getElementById("refreshBtn");
  const status = document.getElementById("status");
  const main = document.getElementById("main");
  const meta = document.getElementById("meta");

  btn.disabled = true;
  btn.textContent = "⏳ Fetching…";
  status.textContent = "Loading headlines from all sources…";
  main.innerHTML = "";
  main.appendChild(status);

  const results = await Promise.all(FEEDS.map(fetchFeed));
  const allItems = results.flat();

  const byCategory = {};
  for (const key of Object.keys(CATEGORY_META)) byCategory[key] = [];
  for (const item of allItems) {
    if (byCategory[item.category]) byCategory[item.category].push(item);
  }

  const failedCount = FEEDS.length - results.filter((r) => r.length > 0).length;

  main.innerHTML = "";
  let anyItems = false;
  for (const [catName, meta_] of Object.entries(CATEGORY_META)) {
    const items = byCategory[catName];
    if (!items.length) continue;
    anyItems = true;
    const section = document.createElement("section");
    section.className = "category";
    const h2 = document.createElement("h2");
    h2.style.borderColor = meta_.color;
    h2.textContent = meta_.emoji + " " + catName;
    section.appendChild(h2);
    const ul = document.createElement("ul");
    ul.className = "item-list";
    for (const item of items) {
      const li = document.createElement("li");
      li.className = "card";
      const head = document.createElement("div");
      head.className = "card-header";
      const a = document.createElement("a");
      a.className = "item-title";
      a.href = item.link;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = item.title;
      const pill = document.createElement("span");
      pill.className = "pill";
      pill.textContent = item.source;
      head.appendChild(a);
      head.appendChild(pill);
      const p = document.createElement("p");
      p.className = "summary";
      p.textContent = item.summary;
      li.appendChild(head);
      li.appendChild(p);
      ul.appendChild(li);
    }
    section.appendChild(ul);
    main.appendChild(section);
  }

  if (!anyItems) {
    main.innerHTML = '<div class="status">Could not load any feeds right now — check your connection and try again.</div>';
  }

  const now = new Date();
  const timeStr = now.toLocaleString("en-GB", {
    timeZone: "Europe/Berlin", day: "2-digit", month: "short", year: "numeric",
    hour: "2-digit", minute: "2-digit",
  });
  meta.textContent = "Last updated: " + timeStr + " (Europe/Berlin)" +
    (failedCount > 0 ? " · " + failedCount + " source(s) unavailable this time" : "");

  btn.disabled = false;
  btn.textContent = "🔄 Fetch latest news";
}

// Auto-fetch once on first load
refreshDigest();
</script>
</body>
</html>
